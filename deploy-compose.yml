services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.multi
      target: api-build
    container_name: Lemefy-API
    ports:
      - 3080:3080
    depends_on:
      - meilisearch
      - rag_api
      - postgres
      - temporal
      - temporal-worker
      - kaneo
    restart: always
    extra_hosts:
    - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=production
      - MEILI_HOST=http://meilisearch:7700
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
      - KANEO_API_URL=${KANEO_API_URL:-}
      - PROXY=${PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1},${no_proxy:-},meilisearch,lemefy-meilisearch,rag_api,host.docker.internal
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,::1},${NO_PROXY:-},meilisearch,lemefy-meilisearch,rag_api,host.docker.internal
      - ADMIN_PANEL_URL=${ADMIN_PANEL_URL:-http://admin.localhost}
    volumes:
      - type: bind
        source: ./lemefy.yaml
        target: /app/lemefy.yaml
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/api/logs
      - ./skill:/app/skill

  admin-panel:
    image: registry.librechat.ai/clickhouse/librechat-admin-panel:latest
    container_name: admin-panel
    depends_on:
      - api
    restart: always
    environment:
      - PORT=3000
      # Plain expansion (not :?) so `docker compose down`/`pull` still run when this is unset.
      # The panel itself refuses to start without it; set ADMIN_PANEL_SESSION_SECRET in .env.
      - SESSION_SECRET=${ADMIN_PANEL_SESSION_SECRET}
      - API_SERVER_URL=http://api:3080
      - VITE_API_BASE_URL=${DOMAIN_CLIENT:-http://localhost}
      - SESSION_COOKIE_SECURE=${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: Lemefy-NGINX
    ports:
      - 80:80
      - 443:443
    depends_on:
      - api
      - admin-panel
    restart: always
    volumes:
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf
  meilisearch:
    container_name: lemefy-meilisearch
    image: getmeili/meilisearch:v1.35.1
    restart: always
    # ports: # Uncomment this to access meilisearch from outside docker
    #   - 7700:7700 # if exposing these ports, make sure your master key is not the default value
    env_file:
      - .env
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
    volumes:
      - ./meili_data_v1.35.1:/meili_data
  postgres:
    container_name: lemefy-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    volumes:
      - postgres_pgdata:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  temporal:
    container_name: lemefy-temporal
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      - DB=postgres
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-postgres_password}
      - POSTGRES_DB=temporal
    depends_on:
      - postgres
    restart: always
    volumes:
      - temporal_data:/tmp/temporal

  temporal-worker:
    container_name: lemefy-temporal-worker
    build:
      context: .
      dockerfile: Dockerfile.temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=rag_api
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
    depends_on:
      - temporal
      - postgres
      - rag_api
    restart: always

  rag_api:
    container_name: lemefy-rag_api
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_DB=rag_api
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env

  kaneo:
    container_name: lemefy-kaneo
    image: ghcr.io/usekaneo/kaneo:latest
    ports:
      - "${KANEO_PORT:-5173}:5173"
    environment:
      - DATABASE_URL=postgres://kaneo:${KANEO_DB_PASSWORD:-kaneo_password}@postgres:5432/kaneo
    env_file:
      - .env
    depends_on:
      - postgres
    restart: always

volumes:
  postgres_pgdata:
  temporal_data:
