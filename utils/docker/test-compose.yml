version: "3.8"
services:
  client:
    build:
      context: .
      dockerfile: Dockerfile.multi
      target: prod-stage
    container_name: Lemefy-NGINX
    ports:
      - 80:80
      - 443:443
    restart: always
    volumes:
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf
  mongodb:
    container_name: chat-mongodb
    ports:
      - 27018:27017
    image: mongo
    restart: always
    volumes:
      - ./data-node:/data/db
    command: mongod --noauth
  meilisearch:
    container_name: chat-meilisearch
    image: getmeili/meilisearch:v1.7.3
    ports:
      - 7700:7700
    env_file:
      - .env
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
    volumes:
      - ./meili_data_v1.7:/meili_data
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: rag_api
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
  rag_api:
    image: registry.lemefy.ai/danny-avila/lemefy-rag-api-dev-lite:latest
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_DB=rag_api
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    ports:
      - 8000:8000
    depends_on:
      - postgres
    env_file:
      - .env

volumes:
  pgdata:
