# Do not edit this file directly. Use a ‘docker-compose.override.yaml’ file if you can.
# Refer to `docker-compose.override.yaml.example’ for some sample configurations.

services:
  api:
    container_name: Lemefy
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - mongodb
      - rag_api
      - kaneo
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    user: "${UID}:${GID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/Lemefy
      - MEILI_HOST=http://meilisearch:7700
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
      - PREFECT_API_URL=http://prefect:4200/api
      - PREFECT_API_KEY=${PREFECT_API_KEY:-}
      - KANEO_API_URL=http://kaneo:5173
      - PROXY=${PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1},${no_proxy:-},mongodb,lemefy-mongodb,meilisearch,lemefy-meilisearch,rag_api,lemefy-vectordb,host.docker.internal
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,::1},${NO_PROXY:-},mongodb,lemefy-mongodb,meilisearch,lemefy-meilisearch,rag_api,lemefy-vectordb,host.docker.internal
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./skill:/app/skill
  admin-panel:
    container_name: admin-panel
    image: registry.librechat.ai/clickhouse/librechat-admin-panel:latest
    ports:
      - "${ADMIN_PANEL_PORT:-3000}:3000"
    depends_on:
      - api
    restart: always
    environment:
      - PORT=3000
      # Plain expansion (not :?) so `docker compose down`/`pull` still run when this is unset.
      # The panel itself refuses to start without it; set ADMIN_PANEL_SESSION_SECRET in .env.
      - SESSION_SECRET=${ADMIN_PANEL_SESSION_SECRET}
      - API_SERVER_URL=http://api:${PORT:-3080}
      - VITE_API_BASE_URL=${DOMAIN_CLIENT:-http://localhost:3080}
      - SESSION_COOKIE_SECURE=${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}
  mongodb:
    container_name: lemefy-mongodb
    image: mongo:8.0.20
    restart: always
    user: "${UID}:${GID}"
    volumes:
      - ./data-node:/data/db
    command: mongod --noauth
  meilisearch:
    container_name: lemefy-meilisearch
    image: getmeili/meilisearch:v1.35.1
    restart: always
    user: "${UID}:${GID}"
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - ./meili_data_v1.35.1:/meili_data
  vectordb:
    container_name: lemefy-vectordb
    image: pgvector/pgvector:0.8.0-pg15-trixie
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    restart: always
    volumes:
      - pgdata2:/var/lib/postgresql/data
  rag_api:
    container_name: lemefy-rag_api
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    depends_on:
      - vectordb
    env_file:
      - .env

  prefect:
    container_name: lemefy-prefect
    image: prefecthq/prefect:latest-python3.11
    command: prefect server start --host 0.0.0.0
    ports:
      - "${PREFECT_PORT:-4200}:4200"
    environment:
      - PREFECT_API_URL=http://prefect:4200/api
      - PREFECT_UI_HOST=0.0.0.0
      - PREFECT_SERVER_HOST=0.0.0.0
      - PREFECT_LOG_LEVEL=INFO
    volumes:
      - prefect_data:/root/.prefect
      - ./config/prefect:/etc/prefect
    restart: always
    depends_on:
      - postgres

  postgres:
    container_name: lemefy-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: prefect
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: ${PREFECT_DB_PASSWORD:-prefect_password}
    volumes:
      - prefect_pgdata:/var/lib/postgresql/data
    restart: always

  lemefy:
    container_name: lemefy-lemefy
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3080}:${PORT:-3080}"
    environment:
      - PREFECT_API_URL=http://prefect:4200
      - PREFECT_API_KEY=${PREFECT_API_KEY:-}
      - KANEO_API_URL=${KANEO_API_URL:-}
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
    depends_on:
      - mongodb
      - rag_api
      - prefect
      - vectordb
      - kaneo
    restart: always
    env_file:
      - .env

  kaneo-postgres:
    container_name: lemefy-kaneo-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kaneo
      POSTGRES_USER: kaneo
      POSTGRES_PASSWORD: ${KANEO_DB_PASSWORD:-kaneo_password}
    volumes:
      - kaneo_pgdata:/var/lib/postgresql/data
    restart: always

  kaneo:
    container_name: lemefy-kaneo
    image: ghcr.io/usekaneo/kaneo:latest
    ports:
      - "${KANEO_PORT:-5173}:5173"
    env_file:
      - .env
    depends_on:
      kaneo-postgres:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  pgdata2:
  prefect_data:
  prefect_pgdata:
  kaneo_pgdata:
