# Do not edit this file directly. Use a ‘docker-compose.override.yaml’ file if you can.
# Refer to `docker-compose.override.yaml.example’ for some sample configurations.

services:
  api:
    container_name: Lemefy
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      rag_api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kaneo:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    user: "${UID}:${GID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/Lemefy
      - MEILI_HOST=http://meilisearch:7700
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
      - KANEO_API_URL=http://kaneo:5173
      - PROXY=${PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1},${no_proxy:-},mongodb,lemefy-mongodb,meilisearch,lemefy-meilisearch,rag_api,host.docker.internal
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,::1},${NO_PROXY:-},mongodb,lemefy-mongodb,meilisearch,lemefy-meilisearch,rag_api,host.docker.internal
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./skill:/app/skill
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-3080}/readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
  admin-panel:
    container_name: admin-panel
    image: registry.librechat.ai/clickhouse/librechat-admin-panel:latest
    ports:
      - "${ADMIN_PANEL_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: always
    environment:
      - PORT=3000
      # Plain expansion (not :?) so `docker compose down`/`pull` still run when this is unset.
      # The panel itself refuses to start without it; set ADMIN_PANEL_SESSION_SECRET in .env.
      - SESSION_SECRET=${ADMIN_PANEL_SESSION_SECRET}
      - API_SERVER_URL=http://api:${PORT:-3080}
      - VITE_API_BASE_URL=${DOMAIN_CLIENT:-http://localhost:3080}
      - SESSION_COOKIE_SECURE=${ADMIN_PANEL_SESSION_COOKIE_SECURE:-false}
  mongodb:
    container_name: lemefy-mongodb
    image: mongo:8.0.20
    restart: always
    user: "${UID}:${GID}"
    volumes:
      - ./data-node:/data/db
    command: mongod --noauth
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
  meilisearch:
    container_name: lemefy-meilisearch
    image: getmeili/meilisearch:v1.35.1
    restart: always
    user: "${UID}:${GID}"
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - ./meili_data_v1.35.1:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
  rag_api:
    container_name: lemefy-rag_api
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_DB=rag_api
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${RAG_PORT:-8000}/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  temporal:
    container_name: lemefy-temporal
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      - DB=postgres
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-postgres_password}
      - POSTGRES_DB=temporal
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    volumes:
      - temporal_data:/tmp/temporal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7233/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  temporal-worker:
    container_name: lemefy-temporal-worker
    build:
      context: .
      dockerfile: Dockerfile.temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=rag_api
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rag_api:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep 'node dist/worker.js' | grep -v grep"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    container_name: lemefy-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    volumes:
      - postgres_pgdata:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  lemefy:
    container_name: lemefy-lemefy
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3080}:${PORT:-3080}"
    environment:
      - KANEO_API_URL=${KANEO_API_URL:-}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      rag_api:
        condition: service_healthy
      temporal-worker:
        condition: service_healthy
      kaneo:
        condition: service_healthy
    restart: always
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-3080}/readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  kaneo:
    container_name: lemefy-kaneo
    image: ghcr.io/usekaneo/kaneo:latest
    ports:
      - "${KANEO_PORT:-5173}:5173"
    environment:
      - DATABASE_URL=postgres://kaneo:${KANEO_DB_PASSWORD:-kaneo_password}@postgres:5432/kaneo
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_pgdata:
  temporal_data:
